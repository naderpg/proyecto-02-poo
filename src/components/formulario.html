<div class="tarjeta">
    <h1>Registrar libro</h1>

    <form class="formulario" id="formulario">
        <div class="campo completo">
            <label>Título</label>
            <input type="text" id="titulo" placeholder="Cien años de soledad">
        </div>

        <div class="campo">
            <label>Autor</label>
            <input type="text" id="autor" placeholder="Gabriel García Márquez">
        </div>

        <div class="campo">
            <label>Año de publicación</label>
            <input type="number" id="fecha" placeholder="1967">
        </div>

        <div class="campo">
            <label>Género</label>
            <select id="genero">
                <option value="">-- Selecciona --</option>
                <option value="Novela">Novela</option>
                <option value="Ciencia">Ciencia</option>
                <option value="Historia">Historia</option>
                <option value="Poesía">Poesía</option>
            </select>
        </div>

        <div class="campo">
            <span class="etiqueta">Estado</span>
            <div class="opciones">
                <label><input type="checkbox" id="disponible" checked> Disponible para préstamo</label>
            </div>
        </div>

        <button type="submit" class="completo">Agregar libro</button>
    </form>
</div>
